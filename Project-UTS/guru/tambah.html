<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAITUN NA'IM - Tambah Guru</title>
    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <div>
            <img src="../assets/picture/logo.png" alt="logo baitun naim" style="width: 3rem;height: 3rem;border-radius: 50%;">
            <h1>BAITUN NA'IM</h1>
        </div>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="menu">&#9776</button>
        <nav>
            <ul>
                <li><a href="../index.html">beranda</a></li>
                <li><a href="list.html">daftar guru</a></li>
                <li><a href="tambah.html">tambah guru</a></li>
                <li><a href="../siswa/list.html">daftar siswa</a></li>
                <li><a href="../siswa/tambah.html">tambah siswa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Guru</h2><br>
            <form id="form-tambah-guru" novalidate>
                <p>
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" required placeholder="Masukan nama...">
                </p>
                <p>
                    <label for="nip">NIP</label>
                    <input type="text" id="nip" name="nip" required placeholder="Masukan NIP...">
                </p>
                <p>
                    <label for="jk">Jenis Kelamin</label>
                    <select id="jk" name="jk">
                        <option value="" disabled selected>Pilih Jenis Kelamin</option>
                        <option value="laki-laki">Laki-Laki</option>
                        <option value="perempuan">Perempuan</option>
                    </select>
                </p>
                <p>
                    <label for="usia">Usia</label>
                    <input type="number" id="usia" name="usia" min="0" required placeholder="Masukan usia...">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Baitunnaim. All rights reserved.</p>
    </footer>
    <script src="../assets/js/script.js"></script>
</body>
</html>
